version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "7001:7001"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MODEL_NAME=gemma-4
      - PORT=7001
    volumes:
      - ./backend:/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_WS_BACKEND_URL=ws://localhost:7001/ws/generate
      - VITE_HTTP_BACKEND_URL=http://localhost:7001/api/generate
    depends_on:
      - backend
    restart: unless-stopped
